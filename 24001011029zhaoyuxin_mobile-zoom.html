    缩回 1x 自动居中。核心实现：
    ① 缩放以两指中点为基准（焦点保持公式 t' = m' - (m - t)*(s'/s)），图片不"跳走"；
    ② 边界软钳位（超出部分 *0.35 阻尼，松手回弹到硬边界）；
    ③ 1x 时平移上限为 0，拖不出边界；

-->

    .zyx1029_btn { border: none; border-radius: 10px; padding: 9px 16px; font-size: 14px; font-weight: 700; cursor: pointer;

    .zyx1029_demo h2 { font-size: 14px; color: var(--zyx1029_accent); margin-bottom: 10px; }
    .zyx1029_demo video { display: block; height: min(460px, 62vh); max-width: 100%; margin: 0 auto;
      border-radius: 12px; background: #000; }
    .zyx1029_demo p { font-size: 12.5px; color: var(--zyx1029_muted); margin-top: 8px; text-align: center; }

    .zyx1029_footer { text-align: center; margin-top: 24px; font-size: 12.5px; color: var(--zyx1029_muted); }

    /* 提示气泡 */

      background: rgba(30,41,59,.92); color: #fff; font-size: 13px; font-weight: 700; padding: 8px 16px;
      border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60; }
    .zyx1029_toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  <script>
    /*
      实现说明（对应验收）：
      ① 缩放以两指中点为基准：焦点保持公式 t' = m' - (m - t)*(s'/s)，
         其中 m/m' 为上一帧/当前帧两指中点（相对容器中心），t 为当前平移，s/s' 为旧/新缩放。
         该式保证"手指下面的那个图像点"在缩放前后位置不变，因此图片不会跳走。
      ② 边界阻尼：拖动/缩放时平移超出硬边界的多余部分 *0.35（软钳位），松手再回弹到硬边界。
      ③ 1x 拖不出边界：scale=1 时图像尺寸=容器尺寸，硬边界 maxT=0，故无法平移。
      ④ 旋转屏幕不丢状态：scale 与 t 持续保存，orientationchange/resize 时仅重新钳位并应用。
      命名前缀统一 zyx1029_（项目规则 1）。
    */

    // 功能名称及简介：zyx1029_initViewer —— 初始化图片查看器的全部触摸手势（缩放/拖动/双击/旋转）
    // 作者：赵雨欣  建立时间：2026-11-16  使用模型：Qwen3.8-Flash
    function zyx1029_initViewer() {
      var box = document.getElementById('zyx1029Viewer');
      var img = document.getElementById('zyx1029Img');
      var chip = document.getElementById('zyx1029ScaleChip');

      var MIN = 1, MAX = 4;       // 缩放上下限
      var scale = 1, tx = 0, ty = 0;   // 当前缩放与平移（平移单位：屏幕像素）
      var mode = '';              // '' | 'pan' | 'pinch'
      var lastDist = 0;           // 上一帧两指距离
      var lastMid = { x: 0, y: 0 };// 上一帧两指中点（相对容器中心）
      var lastX = 0, lastY = 0;   // 单指拖动上一帧坐标
      var startT = 0, startX = 0, startY = 0, moved = false; // 用于双击判定
      var lastTap = 0;

      // 读取容器几何（中心点 + 半宽半高），用于坐标换算与边界计算
      function geom() {
        var r = box.getBoundingClientRect();
        return { w: r.width, h: r.height, left: r.left, top: r.top, cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
      }
      // 触摸点 → 相对容器中心的坐标
      function rel(t, g) { return { x: t.clientX - g.cx, y: t.clientY - g.cy }; }
      // 两指直线距离
      function dist(a, b) { return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY); }

      // 硬边界：图像放大后可平移的最大距离（1x 时为 0）
      function boundAxis(base, cont, s) { return Math.max(0, (base * s - cont) / 2); }
      // 钳位：soft=true 时越界部分 *0.35 产生阻尼；soft=false 时严格限制在边界内
      function clamp(val, max, soft) {
        if (val > max) return soft ? max + (val - max) * 0.35 : max;
        if (val < -max) return soft ? -max + (val + max) * 0.35 : -max;
        return val;
      }
      // 应用变换并更新倍数显示
      function apply() {
        img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
        chip.textContent = '缩放 ' + scale.toFixed(2) + '×';
      }
      // 按当前 scale 把平移钳回边界（hard=松手回弹）
      function clampTranslate(soft) {
        var g = geom();
        tx = clamp(tx, boundAxis(g.w, g.w, scale), soft);
        ty = clamp(ty, boundAxis(g.h, g.h, scale), soft);
      }
      // 开/关过渡动画（跟手时关，回弹/双击时开）
      function anim(on) { img.classList.toggle('zyx1029_anim', on); }
      // 提示气泡
      function toast(msg) {
        var el = document.getElementById('zyx1029Toast');
        el.textContent = msg; el.classList.add('show');
        clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('show'); }, 1200);
      }

      box.addEventListener('touchstart', function (e) {
        anim(false);
        var g = geom();
        startT = Date.now(); moved = false;
        if (e.touches.length === 2) {
          mode = 'pinch';
          lastDist = dist(e.touches[0], e.touches[1]);
          var a = rel(e.touches[0], g), b = rel(e.touches[1], g);
          lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        } else {
          mode = 'pan';
          var t = e.touches[0];
          lastX = t.clientX; lastY = t.clientY;
          startX = t.clientX; startY = t.clientY;
        }
      }, { passive: true });

      box.addEventListener('touchmove', function (e) {
        e.preventDefault();                 // 阻止整页缩放/滚动，需 passive:false
        if (Math.abs(e.touches[0].clientX - startX) + Math.abs(e.touches[0].clientY - startY) > 10) moved = true;
        var g = geom();

        if (e.touches.length >= 2) {        // —— 双指缩放 ——
          mode = 'pinch';
          var d = dist(e.touches[0], e.touches[1]);
          var a = rel(e.touches[0], g), b = rel(e.touches[1], g);
          var mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
          if (lastDist) {
            var ns = scale * (d / lastDist);
            if (ns < MIN) ns = MIN; if (ns > MAX) ns = MAX;
            var ratio = ns / scale;
            // 焦点保持：让上一帧中点下的图像点，在新缩放后仍位于当前中点 → 不跳变（验收①）
            tx = mid.x - (lastMid.x - tx) * ratio;
            ty = mid.y - (lastMid.y - ty) * ratio;
            scale = ns;
          }
          lastDist = d; lastMid = mid;
          clampTranslate(true);             // 缩放时越界用阻尼
          apply();
        } else if (scale > 1) {             // —— 放大后单指拖动 ——
          var t = e.touches[0];
          tx += t.clientX - lastX;
          ty += t.clientY - lastY;
          lastX = t.clientX; lastY = t.clientY;
          clampTranslate(true);             // 拖动越界用阻尼
          apply();
        }
      }, { passive: false });

      box.addEventListener('touchend', function (e) {
        var g = geom();
        if (e.touches.length === 0) {
          // 松手：硬回弹到边界内（验收②）
          anim(true);
          clampTranslate(false);
          apply();

          // —— 双击判定：快速、几乎没移动的一次抬手 ——
          var dur = Date.now() - startT;
          if (!moved && dur < 250) {
            var now = Date.now();
            if (now - lastTap < 300) {
              // 在 1x / 2x 间切换，以点击点为基准
              var m = rel(e.changedTouches[0], g);
              if (scale > 1) { scale = 1; tx = 0; ty = 0; }   // 缩回 1x 自动居中（验收）
              else {
                var ns = 2, ratio = ns / scale;
                tx = m.x - (m.x - tx) * ratio;
                ty = m.y - (m.y - ty) * ratio;
                scale = ns;
                clampTranslate(false);
              }
              apply();
              lastTap = 0;
            } else {
              lastTap = now;
            }
          }
          mode = ''; lastDist = 0;
        } else if (e.touches.length === 1) {
          // 双指变单指：切换到拖动，重置单指起点，避免跳变
          mode = 'pan';
          lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
          lastDist = 0;
        }
      });

      box.addEventListener('touchcancel', function () {
        anim(true); clampTranslate(false); apply();
        mode = ''; lastDist = 0;
      });

      // 验收④：旋转/尺寸变化时保持 scale 状态，仅按新边界重新钳位平移
      function onResize() {
        anim(true);
        clampTranslate(false);
        apply();
      }
      window.addEventListener('orientationchange', function () { setTimeout(onResize, 200); });
      window.addEventListener('resize', onResize);

      // 暴露给"重置"按钮
      window.zyx1029_reset = function () {
        anim(true); scale = 1; tx = 0; ty = 0; apply();
      };

      apply();
    }

    // 功能名称及简介：页面加载后初始化图片查看器
    // 作者：赵雨欣  建立时间：2026-11-16  使用模型：Qwen3.8-Flash
    document.addEventListener('DOMContentLoaded', zyx1029_initViewer);
  </script>
</body>
